<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Kanban Board">
  <meta name="theme-color" content="#10b981">
  <title>Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav>
      <h1>Kanban Board</h1>
    </nav>
  </header>
  <main>
    <div class="board">
      <div class="column" id="to-do">
        <h2>To-Do</h2>
        <div class="cards" id="to-do-cards">
        </div>
        <button class="add-card" id="add-to-do">Add Card</button>
      </div>
      <div class="column" id="in-progress">
        <h2>In Progress</h2>
        <div class="cards" id="in-progress-cards">
        </div>
        <button class="add-card" id="add-in-progress">Add Card</button>
      </div>
      <div class="column" id="done">
        <h2>Done</h2>
        <div class="cards" id="done-cards">
        </div>
        <button class="add-card" id="add-done">Add Card</button>
      </div>
    </div>
  </main>
  <footer>
    Made with GrishteSync | Suryasticsai | suryasticsai@gmail.com
  </footer>
  <script src="script.js"></script>
</body>
</html>
